<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>WAGMI | Orchestrating Digital Experiences</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="WAGMI orchestrates digital experiences through web and mobile app development, backend services, cloud infrastructure, and ERP integrations.">
    <link rel="canonical" href="https://wagmi.my/">

    <!-- WAGMI brand v3: icons, manifest and share image -->
    <link rel="icon" href="favicon.ico" sizes="any">
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <link rel="mask-icon" href="safari-pinned-tab.svg" color="#9BD94A">
    <link rel="manifest" href="site.webmanifest">
    <meta name="theme-color" content="#0E0F0C">

    <meta property="og:type" content="website">
    <meta property="og:site_name" content="WAGMI">
    <meta property="og:title" content="WAGMI | Orchestrating Digital Experiences">
    <meta property="og:description" content="WAGMI orchestrates digital experiences through web and mobile app development, backend services, cloud infrastructure, and ERP integrations.">
    <meta property="og:url" content="https://wagmi.my/">
    <meta property="og:image" content="https://wagmi.my/og-image.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:image:alt" content="The WAGMI mascot, a tabby cat in a frog hat and pixel sunglasses, beside the WAGMi wordmark.">
    <meta name="twitter:card" content="summary_large_image">

    <script type="application/ld+json">
        {
            "@context": "https://schema.org",
            "@graph": [
                {
                    "@type": "Organization",
                    "@id": "https://wagmi.my/#organization",
                    "name": "WAGMI",
                    "legalName": "Wagmi Technology Sdn Bhd",
                    "url": "https://wagmi.my/",
                    "logo": "https://wagmi.my/icon-512.png",
                    "slogan": "Orchestrating Digital Experiences"
                },
                {
                    "@type": "WebSite",
                    "name": "WAGMI",
                    "alternateName": "wagmi.my",
                    "url": "https://wagmi.my/",
                    "publisher": { "@id": "https://wagmi.my/#organization" }
                }
            ]
        }
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Brand tokens (generated from wagmi-brand/tokens/tokens.json; don't edit by hand) -->
    <link rel="stylesheet" href="assets/css/tokens.css">

    <style>
        *, *::before, *::after { box-sizing: border-box; }

        html { background: var(--bg, #0e0f0c); }
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            background: var(--bg, #0e0f0c);
            color: var(--text-muted, #b9b4a8);
            font-family: var(--font-sans);
            font-size: 15px;
            line-height: 22px;
            -webkit-font-smoothing: antialiased;
            overflow-x: hidden;
        }
        ::selection { background: var(--accent-fill); color: var(--on-accent); }

        a { color: var(--accent); }
        a:focus-visible, button:focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 4px;
            border-radius: var(--radius-sm);
        }

        /* Pixel art is never smoothed */
        .pixel { image-rendering: pixelated; }

        .sr-only {
            position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
            overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0;
        }

        /* ---------- Nav ---------- */
        .nav {
            position: fixed;
            inset: 0 0 auto 0;
            z-index: 40;
            height: 64px;
            background: rgba(14, 15, 12, 0.85);
            border-bottom: 1px solid var(--line);
            -webkit-backdrop-filter: blur(12px);
            backdrop-filter: blur(12px);
        }
        .nav-inner {
            max-width: 1152px;
            height: 100%;
            margin: 0 auto;
            padding: 0 24px;
            display: flex;
            align-items: center;
        }
        /* Logotype file is 98 x 40 (41 x 12 grid at 2x, plus 8px clear space).
           Shown at 1:1 so the art is exactly 82 x 24. The negative margin lines
           the art, not the padding, up with the page gutter. */
        .nav-logo { display: block; margin-left: -8px; line-height: 0; }
        .nav-logo img { width: 98px; height: 40px; }

        /* ---------- Hero ---------- */
        .hero {
            position: relative;
            flex: 1;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 96px 16px 64px;
            overflow: hidden;
        }
        #canvas-container {
            position: absolute;
            inset: 0;
            z-index: 0;
            overflow: hidden;
        }
        .hero-fade {
            position: absolute;
            left: 0; right: 0; bottom: 0;
            height: 128px;
            background: linear-gradient(to top, var(--bg), transparent);
            z-index: 0;
        }
        .hero-content { position: relative; z-index: 1; margin: 0; text-align: center; }
        /* Logotype file is 98 x 40 (art 82 x 24 plus clear space). Shown at 4x
           (art 328 x 96), or 2x on phones. Whole multiples only. */
        .hero-logo { display: block; width: 392px; height: 160px; margin: 0 auto; }
        .hero-tagline {
            display: block;
            margin-top: 8px;
            font-size: 15px;
            line-height: 22px;
            font-weight: 500;
            letter-spacing: 0.16em;
            color: var(--text-muted, #b9b4a8);
        }
        @media (max-width: 720px) {
            .hero-logo { width: 196px; height: 80px; }
            .hero-tagline { font-size: 13px; line-height: 18px; letter-spacing: 0.14em; }
        }

        /* ---------- Footer ---------- */
        .footer {
            position: relative;
            z-index: 1;
            border-top: 1px solid var(--line);
            padding: 24px;
            text-align: center;
            font-family: var(--font-mono);
            font-size: 12px;
            line-height: 16px;
            letter-spacing: 0.08em;
            color: var(--text-muted, #b9b4a8);
        }

        @media (prefers-reduced-motion: reduce) {
            #canvas-container { display: none; }
        }
    </style>
</head>
<body>

    <nav class="nav" aria-label="Main">
        <div class="nav-inner">
            <a href="./" class="nav-logo" aria-label="WAGMI home">
                <img src="assets/img/wagmi-logotype.svg" alt="WAGMI" width="98" height="40">
            </a>
        </div>
    </nav>

    <main class="hero" id="hero">
        <div id="canvas-container" aria-hidden="true"></div>
        <div class="hero-fade" aria-hidden="true"></div>

        <h1 class="hero-content">
            <img class="hero-logo" src="assets/img/wagmi-logotype-blink.svg" width="392" height="160" alt="WAGMI">
            <span class="hero-tagline">Orchestrating Digital Experiences</span>
        </h1>
    </main>

    <footer class="footer">
        &copy; <span id="year">2026</span> Wagmi Technology Sdn Bhd
    </footer>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
    <script>
        document.getElementById('year').textContent = new Date().getFullYear();

        // Lime pixel-dot wave behind the hero. Skipped when the visitor prefers reduced motion.
        function initWave() {
            const container = document.getElementById('canvas-container');
            if (!container || typeof THREE === 'undefined') return;
            if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;

            const scene = new THREE.Scene();
            const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 15, 30);
            camera.lookAt(0, 0, 0);

            const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: false });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            container.appendChild(renderer.domElement);

            const countX = 50, countZ = 50, separation = 2;
            const offsetX = (countX * separation) / 2;
            const offsetZ = (countZ * separation) / 2;
            const positions = new Float32Array(countX * countZ * 3);
            let i = 0;
            for (let x = 0; x < countX; x++) {
                for (let z = 0; z < countZ; z++) {
                    positions[i] = x * separation - offsetX;
                    positions[i + 1] = 0;
                    positions[i + 2] = z * separation - offsetZ;
                    i += 3;
                }
            }
            const geometry = new THREE.BufferGeometry();
            geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));

            const material = new THREE.PointsMaterial({
                size: 0.14,
                color: 0x9BD94A, // brand-lime
                transparent: true,
                opacity: 0.45,
            });
            const points = new THREE.Points(geometry, material);
            scene.add(points);

            let mouseX = 0, mouseY = 0;
            document.addEventListener('mousemove', (e) => {
                mouseX = e.clientX - window.innerWidth / 2;
                mouseY = e.clientY - window.innerHeight / 2;
            });

            const clock = new THREE.Clock();
            (function animate() {
                requestAnimationFrame(animate);
                const t = clock.getElapsedTime();
                const p = geometry.attributes.position.array;
                let j = 0;
                for (let x = 0; x < countX; x++) {
                    for (let z = 0; z < countZ; z++) {
                        p[j + 1] = Math.sin(x / 2 + t) * 2 + Math.cos(z / 2 + t) * 2;
                        j += 3;
                    }
                }
                geometry.attributes.position.needsUpdate = true;
                points.rotation.y += 0.05 * (mouseX * 0.001 - points.rotation.y);
                points.rotation.x += 0.05 * (mouseY * 0.001 - points.rotation.x);
                renderer.render(scene, camera);
            })();

            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });
        }

        document.addEventListener('DOMContentLoaded', initWave);
    </script>
</body>
</html>
