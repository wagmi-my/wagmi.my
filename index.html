<html lang="en">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        background: '#08090A',
                        surface: '#121417',
                        border: 'rgba(255, 255, 255, 0.1)',
                        primary: '#5E6AD2',
                    },
                    animation: {
                        'pulse-slow': 'pulse 4s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                    }
                }
            }
        }
    </script>

    <style>
        body {
            background-color: #08090A;
            color: #A1A1AA;
            overflow-x: hidden;
            /* Hide default scrollbar for cleaner look */
            scrollbar-width: none;
            -ms-overflow-style: none;
        }
        body::-webkit-scrollbar {
            display: none;
        }

        /* Cinematic Grain */
        .noise-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 50;
            opacity: 0.04;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
        }

        /* Scroll Reveal */
        .reveal {
            opacity: 0;
            transform: translateY(30px);
            transition: all 1s cubic-bezier(0.5, 0, 0, 1);
        }
        .reveal.active {
            opacity: 1;
            transform: translateY(0);
        }

        /* --- GLASS CARD ENGINE --- */
        .glass-card {
            background: rgba(255, 255, 255, 0.01);
            border-radius: 1rem;
            position: relative;
            overflow: hidden;
            border: 1px solid transparent;
            transform-style: preserve-3d;
            transform: perspective(1000px);
        }
        .glass-card > * { transform: translateZ(20px); }

        .glass-card::after {
            content: "";
            position: absolute;
            inset: 0;
            border-radius: 1rem;
            padding: 1px;
            background: linear-gradient(to bottom, rgba(255,255,255,0.1), rgba(255,255,255,0.05));
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            mask-composite: exclude;
            pointer-events: none;
        }

        .glass-card::before {
            content: "";
            position: absolute;
            inset: -1px;
            background: radial-gradient(
                800px circle at var(--mouse-x) var(--mouse-y),
                rgba(255, 255, 255, 0.4),
                transparent 40%
            );
            opacity: 0;
            transition: opacity 0.5s;
            pointer-events: none;
            z-index: -1;
        }
        .glass-card:hover::before { opacity: 1; }

        #canvas-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            overflow: hidden;
        }

        /* --- 2. RGB GLITCH EFFECT --- */
        .glitch-wrapper {
            position: relative;
            display: inline-block;
        }

        .glitch-text {
            position: relative;
            z-index: 1;
        }

        .glitch-text::before,
        .glitch-text::after {
            content: attr(data-text);
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #08090A; /* Matches bg color to hide main text */
            opacity: 0.8;
            display: none;
        }

        /* Red Shift */
        .glitch-text::before {
            color: #ff00ff;
            z-index: -1;
            transform: translate(-2px, -2px);
            mix-blend-mode: screen;
        }

        /* Blue Shift */
        .glitch-text::after {
            color: #00ffff;
            z-index: -2;
            transform: translate(2px, 2px);
            mix-blend-mode: screen;
        }

        .glitch-wrapper:hover .glitch-text::before,
        .glitch-wrapper:hover .glitch-text::after {
            display: block;
            animation: glitch-anim 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94) both infinite;
        }

        @keyframes glitch-anim {
            0% { transform: translate(0); }
            20% { transform: translate(-2px, 2px); }
            40% { transform: translate(-2px, -2px); }
            60% { transform: translate(2px, 2px); }
            80% { transform: translate(2px, -2px); }
            100% { transform: translate(0); }
        }
    </style>
</head>
<body class="antialiased selection:bg-primary selection:text-white">

    <div class="noise-overlay"></div>

    <nav class="fixed w-full z-40 border-b border-white/5 bg-background/80 backdrop-blur-md top-0 transition-all duration-300">
        <div class="max-w-6xl mx-auto px-6 h-16 flex items-center justify-between">
            <a href="" class="text-white font-bold text-lg tracking-tight hover:text-primary transition-colors">WAGMI TECHNOLOGY</a>
            <button class="md:hidden text-white" aria-label="Open navigation menu"><i class="ri-menu-line text-xl"></i></button>
        </div>
    </nav>

    <section id="hero" class="min-h-screen flex items-center justify-center pt-20 px-6 relative overflow-hidden">

        <div id="canvas-container"></div>
        <div class="absolute bottom-0 left-0 w-full h-32 bg-gradient-to-t from-[#08090A] to-transparent z-0"></div>

        <div class="max-w-4xl text-center z-10 reveal active pointer-events-none">
            <div class="glitch-wrapper pointer-events-auto mb-8">
                <h1 class="glitch-text text-5xl md:text-8xl font-bold tracking-tight text-white cursor-default" data-text="WAGMI">
                    WAGMI
                </h1>
            </div>

            <p class="hacker-text text-xl text-gray-400 max-w-2xl mx-auto mb-12 leading-relaxed pointer-events-auto">
                orchestrating digital experiences
            </p>
        </div>
    </section>

    <script>
        // --- 1. THREE.JS: DIGITAL TERRAIN WAVE ---
        function initThreeJS() {
            const container = document.getElementById('canvas-container');
            if (!container) return;

            const scene = new THREE.Scene();

            // Camera: Positioned higher and angled down for a "landscape" view
            const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 15, 30); // x, y, z
            camera.lookAt(0, 0, 0);

            const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            container.appendChild(renderer.domElement);

            // --- GEOMETRY: Structured Grid instead of random points ---
            const particlesGeometry = new THREE.BufferGeometry();
            const countX = 50; // Grid width
            const countZ = 50; // Grid depth
            const totalParticles = countX * countZ;

            const posArray = new Float32Array(totalParticles * 3);

            // We create a flat grid on the XZ plane
            let i = 0;
            const separation = 2; // Distance between dots
            const offsetX = (countX * separation) / 2;
            const offsetZ = (countZ * separation) / 2;

            for (let x = 0; x < countX; x++) {
                for (let z = 0; z < countZ; z++) {
                    // X position
                    posArray[i] = (x * separation) - offsetX;
                    // Y position (starts flat, we animate this later)
                    posArray[i + 1] = 0;
                    // Z position
                    posArray[i + 2] = (z * separation) - offsetZ;

                    i += 3;
                }
            }

            particlesGeometry.setAttribute('position', new THREE.BufferAttribute(posArray, 3));

            // Material: Slightly smaller, sharper dots for a "technical" look
            const material = new THREE.PointsMaterial({
                size: 0.12,
                color: 0x5E6AD2, // Brand Primary Color
                transparent: true,
                opacity: 0.8,
            });

            const particlesMesh = new THREE.Points(particlesGeometry, material);
            scene.add(particlesMesh);

            // Mouse Interaction Variables
            let mouseX = 0;
            let mouseY = 0;
            let targetX = 0;
            let targetY = 0;

            const windowHalfX = window.innerWidth / 2;
            const windowHalfY = window.innerHeight / 2;

            document.addEventListener('mousemove', (event) => {
                mouseX = (event.clientX - windowHalfX);
                mouseY = (event.clientY - windowHalfY);
            });

            const clock = new THREE.Clock();

            function animate() {
                requestAnimationFrame(animate);
                const elapsedTime = clock.getElapsedTime();

                // 1. WAVE ANIMATION ALGORITHM
                // We access the position array directly to modify Y values
                const positions = particlesGeometry.attributes.position.array;

                let j = 0;
                for (let x = 0; x < countX; x++) {
                    for (let z = 0; z < countZ; z++) {
                        // We create a "wave" by using Sine/Cosine based on X/Z coordinates + Time
                        // This creates the "breathing" liquid landscape effect
                        const yIndex = j + 1;

                        // The Math: Sin(x + time) + Cos(z + time) creates complex interference patterns
                        positions[yIndex] = (Math.sin((x / 2) + elapsedTime) * 2) +
                                            (Math.cos((z / 2) + elapsedTime) * 2);

                        j += 3;
                    }
                }

                // Flag geometry as needing an update so GPU redraws it
                particlesGeometry.attributes.position.needsUpdate = true;

                // 2. MOUSE PARALLAX (Smooth Easing)
                targetX = mouseX * 0.001;
                targetY = mouseY * 0.001;

                // Rotate the entire terrain based on mouse
                particlesMesh.rotation.y += 0.05 * (targetX - particlesMesh.rotation.y);
                particlesMesh.rotation.x += 0.05 * (targetY - particlesMesh.rotation.x);

                renderer.render(scene, camera);
            }

            animate();

            // Handle Resize
            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });
        }

        // --- 2. TEXT SCRAMBLE ---
        const letters = "abcdefghijklmnopqrstuvwxyz!@#$%^&*()_+";
        function enableTextScramble(selector) {
            document.querySelectorAll(selector).forEach(element => {
                element.dataset.value = element.innerText;
                element.onmouseover = event => {
                    let iteration = 0;
                    clearInterval(event.target.interval);
                    event.target.interval = setInterval(() => {
                        event.target.innerText = event.target.innerText
                            .split("")
                            .map((letter, index) => {
                                if (index < iteration) return event.target.dataset.value[index];
                                return letters[Math.floor(Math.random() * 26)];
                            })
                            .join("");
                        if (iteration >= event.target.dataset.value.length) {
                            clearInterval(event.target.interval);
                        }
                        iteration += 1 / 3;
                    }, 30);
                };
            });
        }

        // --- 3. MASTER INITIALIZATION ---
        document.addEventListener("DOMContentLoaded", () => {

            // A. Start Three.js
            initThreeJS();

            // B. Start Lenis (Smooth Scroll)
            const lenis = new Lenis({
                duration: 1.2,
                easing: (t) => Math.min(1, 1.001 - Math.pow(2, -10 * t)), // Exponential easing
                direction: 'vertical',
                gestureDirection: 'vertical',
                smooth: true,
                mouseMultiplier: 1,
                smoothTouch: false,
                touchMultiplier: 2,
            });
            function raf(time) {
                lenis.raf(time);
                requestAnimationFrame(raf);
            }
            requestAnimationFrame(raf);

            // C. Start Vanilla Tilt
            VanillaTilt.init(document.querySelectorAll(".glass-card"), {
                max: 10, speed: 400, glare: true, "max-glare": 0.2, gyroscope: true, scale: 1.02
            });

            // D. Start Text Scramble
            enableTextScramble(".hacker-text");

            // E. Spotlight Borders
            document.querySelectorAll('.glass-card').forEach(card => {
                card.onmousemove = e => {
                    const rect = card.getBoundingClientRect();
                    const x = e.clientX - rect.left;
                    const y = e.clientY - rect.top;
                    card.style.setProperty('--mouse-x', `${x}px`);
                    card.style.setProperty('--mouse-y', `${y}px`);
                };
            });

            // F. Scroll Reveal
            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        entry.target.classList.add('active');
                    }
                });
            }, { threshold: 0.1 });
            document.querySelectorAll('.reveal').forEach(el => observer.observe(el));
        });
    </script>

</body>
