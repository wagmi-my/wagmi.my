<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Page not found | WAGMI</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex">

    <link rel="icon" href="/favicon.ico" sizes="any">
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <link rel="mask-icon" href="/safari-pinned-tab.svg" color="#9BD94A">
    <link rel="manifest" href="/site.webmanifest">
    <meta name="theme-color" content="#0E0F0C">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="/assets/css/tokens.css">

    <style>
        *, *::before, *::after { box-sizing: border-box; }
        html { background: var(--bg, #0e0f0c); }
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            background: var(--bg, #0e0f0c);
            color: var(--text-muted, #b9b4a8);
            font-family: var(--font-sans);
            font-size: 15px;
            line-height: 22px;
            -webkit-font-smoothing: antialiased;
        }
        ::selection { background: var(--accent-fill); color: var(--on-accent); }
        .pixel { image-rendering: pixelated; }

        .nav { height: 64px; border-bottom: 1px solid var(--line); }
        .nav-inner {
            max-width: 1152px; height: 100%; margin: 0 auto; padding: 0 24px;
            display: flex; align-items: center;
        }
        .nav-logo { display: block; margin-left: -8px; line-height: 0; }
        .nav-logo img { width: 98px; height: 40px; }

        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 48px 16px;
        }
        .mascot { width: 256px; height: auto; max-width: 100%; }
        .code {
            margin: 24px 0 8px;
            font-family: var(--font-mono);
            font-size: 12px;
            line-height: 16px;
            font-weight: 500;
            letter-spacing: 0.08em;
            color: var(--accent);
        }
        h1 {
            margin: 0 0 8px;
            font-size: 32px;
            line-height: 38px;
            font-weight: 700;
            letter-spacing: -0.01em;
            color: var(--text);
        }
        p { margin: 0 0 32px; max-width: 36ch; }

        .button {
            display: inline-block;
            padding: 12px 20px;
            border-radius: var(--radius-sm);
            background: var(--accent-fill);
            color: var(--on-accent);
            font-weight: 600;
            text-decoration: none;
        }
        .button:hover { background: var(--brand-mint); }
        .button:focus-visible, .nav-logo:focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 4px;
        }

        .footer {
            border-top: 1px solid var(--line);
            padding: 24px;
            text-align: center;
            font-family: var(--font-mono);
            font-size: 12px;
            line-height: 16px;
            letter-spacing: 0.08em;
        }
    </style>
</head>
<body>
    <nav class="nav" aria-label="Main">
        <div class="nav-inner">
            <a href="/" class="nav-logo" aria-label="WAGMI home">
                <img src="/assets/img/wagmi-logotype.svg" alt="WAGMI" width="98" height="40">
            </a>
        </div>
    </nav>

    <main>
        <img class="mascot" src="/assets/img/wagmi-mascot-surprised-256.png" width="256" height="229"
             alt="The WAGMI mascot looking surprised">
        <div class="code">ERROR 404</div>
        <h1>This page wandered off</h1>
        <p>We couldn't find what you were looking for. It may have moved, or the link may be wrong.</p>
        <a class="button" href="/">Back to home</a>
    </main>

    <footer class="footer">
        &copy; <span id="year">2026</span> Wagmi Technology Sdn Bhd
    </footer>
    <script>document.getElementById('year').textContent = new Date().getFullYear();</script>
</body>
</html>
